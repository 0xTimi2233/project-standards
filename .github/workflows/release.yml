name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 自动化 Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node

  build-binaries:
    name: 编译跨平台独立二进制 (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: 编译跨平台二进制并生成校验和
        shell: bash
        run: |
          mkdir -p dist
          PKG_NAME=$(jq -r .name package.json)
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          fi
          ARTIFACT_NAME="${PKG_NAME}-${{ matrix.target }}${EXT}"
          
          ENTRY="src/cli.ts"
          [ -f "src/index.ts" ] && ENTRY="src/index.ts"
          [ -f "scripts/standards.ts" ] && ENTRY="scripts/standards.ts"
          
          bun build --compile --minify --target=${{ matrix.target }} "$ENTRY" --outfile "dist/${ARTIFACT_NAME}"
          cd dist
          sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
      - name: 上传构建产物至 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" dist/* --clobber
