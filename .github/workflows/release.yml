name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    name: 构建跨平台二进制 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: standards-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: standards-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: standards-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: standards-windows-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Bun 运行时
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 编译跨平台独立二进制
        shell: bash
        run: |
          mkdir -p dist
          bun build --compile --minify --target=${{ matrix.target }} scripts/standards.ts --outfile dist/${{ matrix.artifact }}

      - name: 暂存构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成校验和并创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release-artifacts
          sha256sum standards* > SHA256SUMS
          gh release create "$TAG_NAME" --generate-notes --title "$TAG_NAME" *
