name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Bun 运行时
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 格式规范与静态分析 (Biome)
        run: bun run lint

      - name: TypeScript 类型检查
        run: bun run typecheck

      - name: 执行单元测试
        run: bun test

  docs-quality:
    name: 文档规范与链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装文档校验工具
        run: |
          npm install -g markdownlint-cli2 @mermaid-js/mermaid-cli
          curl -s https://api.github.com/repos/lycheeverse/lychee/releases/latest | grep "browser_download_url.*x86_64-unknown-linux-gnu.tar.gz" | cut -d : -f 2,3 | tr -d \" | wget -qi -
          tar -xzf lychee-*.tar.gz && sudo mv lychee /usr/local/bin/

      - name: 检查文档格式与链接
        run: |
          markdownlint-cli2 "**/*.md"
          lychee --offline .
