name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 质量检查与测试
    uses: ./.github/workflows/checks.yml

  security:
    name: 安全审计与扫描
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  gate:
    name: 合并门禁
    needs: [checks, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 校验检查结果
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "CI 门禁未全部通过: checks=${CHECKS_RESULT}, security=${SECURITY_RESULT}"
            exit 1
          fi
