name: 功能需求（Feature Request）
description: 提出新增能力诉求、架构演进或体验优化建议
title: "[Feat]: "
labels: ["type/feat"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提报前自检
      description: 提交需求前请确认满足以下条件。
      options:
        - label: 我已在现有 Issue 及 Discussions 中检索，确认该需求未曾被提报或正在讨论
          required: true
        - label: 我确认该需求符合本项目的规划边界与核心定位
          required: true
  - type: textarea
    id: motivation
    attributes:
      label: 业务背景与痛点
      description: 阐述当前的限制场景、遇到了何种阻碍以及为何需要这项能力。
      placeholder: 请在此描述具体的业务挑战与应用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案与设计构想
      description: 阐述建议的 API 形式、CLI 交互模式或具体的架构设计。
      placeholder: 请描述该功能应当如何运作与调用。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或权衡思考
      description: 描述是否考虑过其他实现方案、折中手段或临时替代方案。
