name: Bug Report
description: 提交系统缺陷、异常崩溃或不符合预期的行为
title: "Bug Report: "
labels: ["type/bug"]
body:
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统版本、核心运行时版本以及关键依赖版本。
      placeholder: 如 macOS 15.0 / Rust 1.85 / Bun 1.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 清晰列出能够稳定复现该异常的具体操作流程。
      placeholder: |
        1. 执行某条命令或发起请求
        2. 触发特定分支条件
        3. 观察到异常输出
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 现象对比
      description: 明确阐述实际发生的结果以及理应出现的正确预期。
      placeholder: |
        实际行为：
        预期行为：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充日志
      description: 粘贴相关堆栈信息、日志输出或辅助说明。
      render: shell
