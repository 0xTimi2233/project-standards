name: 缺陷报告（Bug Report）
description: 提交系统缺陷、逻辑异常或运行崩溃
title: "[Bug]: "
labels: ["type/bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提报前自检
      description: 提交缺陷前请确认满足以下条件。
      options:
        - label: 我已在现有 Issue 中检索，确认未曾有人提交过相同问题
          required: true
        - label: 我确认已升级至最新版本，该异常依然存在
          required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统版本、核心运行时版本以及关键依赖版本。
      placeholder: |
        - 操作系统：如 macOS 15.0 / Ubuntu 24.04 / Windows 11
        - 运行环境：如 Rust 1.85 / Bun 1.2 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 清晰列出能够稳定复现该异常的具体操作流程与最小命令。
      placeholder: |
        1. 执行命令 `...`
        2. 触发特定输入参数或操作
        3. 观察到异常行为
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 阐明系统在正常工作时理应呈现的行为表现。
      placeholder: 描述预期期望的正确结果或输出。
    validations:
      required: true
  - type: textarea
    id: logs-and-screenshots
    attributes:
      label: 日志与上下文
      description: 提供相关错误日志、调用堆栈或截图信息。
